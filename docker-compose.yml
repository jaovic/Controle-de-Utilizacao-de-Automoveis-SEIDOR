services:
  db:
    image: postgres:16-alpine
    container_name: ttp-completo-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ttp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ttp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: ttp-completo-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ttp?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/ttp?schema=public
      SEED: "true"
      # Valor apenas para uso local. Em produção gere um segredo aleatório.
      JWT_SECRET: local-dev-secret-change-me-in-production-0123456789
      COOKIE_SECURE: "false"
      ADMIN_EMAIL: admin@ttp.local
      ADMIN_PASSWORD: Admin@123
      # A API recebe as requisições do front através do container web (1 proxy).
      TRUST_PROXY: 1
    ports:
      - "3333:3333"

  web:
    build: ./frontend
    container_name: ttp-completo-web
    depends_on:
      - api
    environment:
      BACKEND_URL: http://api:3333
    ports:
      - "3000:3000"

volumes:
  pgdata:
